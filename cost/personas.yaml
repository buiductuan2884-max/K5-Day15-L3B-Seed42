# Kịch bản giả định cho bản thử nhà xe; không phải số người dùng thực đo.
sessions: 50
seed: 42

users:
  low: 300
  base: 700
  high: 1000
  source: "(tự ước tính) quy mô người dùng tiềm năng mỗi tháng; chưa có dữ liệu nhà xe"

personas:
  - name: hoi_thong_tin
    share: 0.5
    uses_per_month: 1
    turns_per_session: 1
    source: "(tự ước tính) khách hỏi lịch, tuyến hoặc giá công khai"
    inputs: ["Nhà xe có chuyến từ Hà Nội đến Hải Phòng vào buổi sáng không?", "Giá niêm yết tuyến Hà Nội - Hải Phòng là bao nhiêu?"]
  - name: can_lam_ro
    share: 0.3
    uses_per_month: 2
    turns_per_session: 2
    source: "(tự ước tính) khách cần hỏi lại về chuyến hoặc chính sách"
    inputs: ["Cho tôi hỏi giờ xe chạy?", "Chính sách đổi vé của nhà xe thế nào?"]
  - name: can_nhan_vien
    share: 0.2
    uses_per_month: 3
    turns_per_session: 3
    source: "(tự ước tính) khách cần người xử lý vé hoặc thanh toán"
    inputs: ["Tôi muốn hoàn tiền cho vé đã đặt, vui lòng hỗ trợ.", "Tôi đã thanh toán nhưng chưa thấy vé, nhờ nhân viên kiểm tra."]

# Giá chuẩn OpenAI USD / 1 triệu token, chưa tính chiết khấu cache.
prices:
  - model: gpt-5.4-mini
    input: 0.75
    output: 4.50
    source: "https://developers.openai.com/api/docs/models/gpt-5.4-mini — xem 27/11/2026"
  - model: gpt-6.2-sol
    input: 2.00
    output: 10.00
    source: "https://developers.openai.com/api/docs/pricing — xem 27/11/2026, Standard"
